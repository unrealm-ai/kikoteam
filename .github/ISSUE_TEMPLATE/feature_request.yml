name: 功能建议 (Feature Request)
description: 提出新特性、内置 AI 员工模板、Skill、MCP 插件或渠道体验改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 建议类别 (Category)
      options:
        - AI 员工与工作台交互 (Web / 对话 / 任务中心)
        - 人机协同与多员工协作 (人工确认 / 事项交接 / TaskSpace)
        - 办公渠道与自动化触发 (飞书 / 钉钉 / 企业微信 / 定时 / Webhook)
        - 能力扩展与内置目录 (官方模板 / Skill / MCP 插件 / 模型协议)
        - 运行时与沙箱安全 (Agent Engine / Sandbox Runner / 容器隔离)
        - 部署、运维与文档
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 应用场景与痛点 (Problem / Use Case)
      description: 你在什么业务或协作场景下遇到了什么不便？
      placeholder: "例如：在团队使用周报 AI 员工时，希望能..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案 (Proposed Solution)
      description: 你希望 KIKO 怎样支持这一能力？（包括界面交互、配置项或接口行为）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或参考实现 (Alternatives / References)
      description: 目前是否有临时替代做法（例如通过自定义 Skill 或 Webhook 实现），或有其他产品的参考设计？
    validations:
      required: false
