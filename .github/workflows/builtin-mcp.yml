name: Builtin MCP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sandbox-runner/builtin-mcp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: sandbox-runner/builtin-mcp/package-lock.json
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 procps ripgrep fd-find
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd
      - run: npm ci --no-audit --no-fund
      - run: npm rebuild node-pty
      - name: Check and test under the inherited non-root account
        run: npm run check
