name: Publish images

on:
  push:
    branches: [main]
    # Markdown embedded by the application (for example employee skills) is a build input.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '_internal/**'
      - '*/docs/**'
      - '*/README.md'
      - 'shared/trigger/README.md'
      - 'sandbox-runner/builtin-mcp/README.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# Finish publishing the running revision; keep one pending automatic build.
# Re-running an older revision must not displace a pending main push.
concurrency:
  group: publish-images-${{ github.run_attempt == 1 && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            file: deploy/local/backend.Dockerfile
          - image: event-hub
            file: deploy/local/event-hub.Dockerfile
          - image: agent-engine
            file: agent-engine/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: type=sha,format=short,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  release:
    name: Publish latest image tags
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read
    concurrency:
      group: publish-verified-images
      queue: max
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the built main revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last_success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/images.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].run_number // 0')
          if (( GITHUB_RUN_NUMBER < last_success )); then
            echo "A newer main build has already succeeded. Keeping the commit tags."
            exit 0
          fi
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          for name in backend event-hub agent-engine; do
            image="ghcr.io/$repository/$name"
            commit_tag="$image:${GITHUB_SHA::7}"
            docker buildx imagetools inspect --raw "$commit_tag" > "$RUNNER_TEMP/commit.json"
            jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") | .platform | [.os, .architecture]] == [["linux", "amd64"]]' "$RUNNER_TEMP/commit.json"
            docker buildx imagetools create --tag "$image:latest" "$commit_tag"
            docker buildx imagetools inspect --raw "$image:latest" > "$RUNNER_TEMP/latest.json"
            cmp "$RUNNER_TEMP/commit.json" "$RUNNER_TEMP/latest.json"
            printf 'Verified `%s` at `%s` for linux/amd64.\n' "$name" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          done
