name: Static checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            backend/go.sum
            event-hub/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: sandbox-runner/builtin-mcp/package-lock.json
      - name: Install static check dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix sandbox-runner/builtin-mcp
          python3 -m venv event-hub/.venv
          event-hub/.venv/bin/pip install -r event-hub/requirements-dev.txt
      - name: Run the shared read-only entry
        run: make lint
