Resources:
  type: object
  additionalProperties: false
  required: [skills, plugins, problems]
  properties:
    skills: {type: array, items: {$ref: '#/Skill'}}
    plugins: {type: array, items: {$ref: '#/Plugin'}}
    problems: {type: array, items: {type: string}, description: Sanitized unavailable-resource codes and IDs, never provider errors or credentials.}
Skill:
  type: object
  additionalProperties: false
  required: [skill_id, version_id, name, description, scope]
  properties:
    skill_id: {type: string, format: uuid}
    version_id: {type: string, format: uuid}
    name: {type: string}
    description: {type: string}
    scope: {type: string, enum: [official, workspace], description: Owner of the immutable version on the shared local mount.}
Plugin:
  type: object
  additionalProperties: false
  required: [plugin_id, version_id, account_id, account_version, endpoint, headers, tools]
  properties:
    plugin_id: {type: string, format: uuid}
    version_id: {type: string, format: uuid}
    account_id: {type: string, format: uuid}
    source: {enum: [workspace, agent]}
    account_version: {type: integer, minimum: 1}
    endpoint: {type: string, format: uri-reference}
    headers: {type: object, additionalProperties: {type: string}, description: Scoped platform relay credential for authenticated plugins.}
    tools:
      type: array
      items:
        type: object
        required: [name, description, input_schema, schema_digest]
        properties:
          name: {type: string}
          description: {type: string}
          input_schema: {type: object}
          schema_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
Authorize:
  type: object
  additionalProperties: false
  required: [phase, native_tool_call_id, plugin_id, tool_name, input_schema]
  properties:
    account_id: {type: string, format: uuid}
    phase: {enum: [check, authorize]}
    native_tool_call_id: {type: string, minLength: 1, maxLength: 256}
    plugin_id: {type: string, format: uuid}
    tool_name: {type: string, minLength: 1, maxLength: 200}
    input_schema: {type: object, description: Actual Pi tool parameters after native MCP normalization. Verified against the pinned and freshly discovered tool schema.}
Finish:
  type: object
  additionalProperties: false
  required: [phase, call_id, status]
  properties:
    phase: {const: finish}
    call_id: {type: string, format: uuid}
    status: {enum: [succeeded, failed], description: Native tool result as reported. Does not prove an external side effect was rolled back.}
