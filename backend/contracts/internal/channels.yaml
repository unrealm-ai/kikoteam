{
  "schemas": {
    "Inbound": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "binding_id",
        "connection_generation",
        "config_revision",
        "rules_version",
        "provider_event_id",
        "provider_message_id",
        "external_tenant_id",
        "external_chat_id",
        "chat_type",
        "sender_id",
        "text",
        "message_type"
      ],
      "properties": {
        "binding_id": {
          "type": "string",
          "format": "uuid"
        },
        "connection_generation": {
          "type": "integer",
          "minimum": 1
        },
        "config_revision": {
          "type": "integer",
          "minimum": 1
        },
        "rules_version": {
          "type": "integer",
          "minimum": 1
        },
        "provider_event_id": {
          "type": "string"
        },
        "provider_message_id": {
          "type": "string"
        },
        "external_tenant_id": {
          "type": "string"
        },
        "external_chat_id": {
          "type": "string"
        },
        "sender_id": {
          "type": "string"
        },
        "text": {
          "type": "string"
        },
        "reply_message_id": {
          "type": "string",
          "maxLength": 256,
          "description": "Parent message ID from the authenticated Feishu main DM callback, not derived from quoted text."
        },
        "quoted_text": {
          "type": "string",
          "maxLength": 65536,
          "description": "Optional WeCom quote text for display and model context. The adapter preserves the current message separately in text. Quote content supplies no identity, history anchor or verification eligibility."
        },
        "message_type": {
          "type": "string",
          "description": "Original provider message type. Text-bearing inputs include Feishu post, DingTalk richText and WeCom mixed."
        },
        "thread_id": {
          "type": "string"
        },
        "chat_type": {
          "enum": [
            "direct",
            "group"
          ]
        },
        "created_at_ms": {
          "type": "integer",
          "minimum": 0
        },
        "bot_mentioned": {
          "type": "boolean"
        },
        "mentions": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [],
            "properties": {
              "id": {
                "type": "string"
              },
              "key": {
                "type": "string"
              },
              "name": {
                "type": "string",
                "maxLength": 1024
              },
              "id_type": {
                "type": "string",
                "maxLength": 64
              },
              "tenant_key": {
                "type": "string",
                "maxLength": 256
              }
            }
          },
          "maxItems": 100
        },
        "sender_name": {
          "type": "string",
          "maxLength": 1024
        },
        "sender_id_type": {
          "type": "string",
          "maxLength": 64
        },
        "sender_tenant": {
          "type": "string",
          "maxLength": 256
        },
        "bot_id": {
          "type": "string",
          "maxLength": 200,
          "description": "Required authenticated provider bot identity for DingTalk/WeCom; not configuration evidence."
        },
        "chat_name": {
          "type": "string",
          "maxLength": 512
        },
        "provider_directed": {
          "type": "boolean"
        },
        "control_eligible": {
          "type": "boolean",
          "description": "Trusted adapter attests a direct pure-text event, without quote/mixed attachment content."
        },
        "media": {
          "type": "array",
          "maxItems": 32,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "name",
              "kind",
              "locator"
            ],
            "properties": {
              "name": {
                "type": "string",
                "maxLength": 240
              },
              "kind": {
                "enum": [
                  "image",
                  "file"
                ]
              },
              "locator": {
                "type": "string",
                "maxLength": 16384,
                "description": "Opaque encrypted resource bound to binding generation, original message and ordinal."
              }
            }
          }
        }
      }
    },
    "HistoryJob": {
      "type": "object",
      "additionalProperties": false,
      "required": [],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "lease_token": {
          "type": "string",
          "format": "uuid"
        },
        "binding_id": {
          "type": "string",
          "format": "uuid"
        },
        "connection_generation": {
          "type": "integer",
          "minimum": 1
        },
        "config_revision": {
          "type": "integer",
          "minimum": 1
        },
        "rules_version": {
          "type": "integer",
          "minimum": 1
        },
        "trigger_created_at_ms": {
          "type": "integer",
          "minimum": 1
        },
        "chat_id": {
          "type": "string"
        },
        "thread_id": {
          "type": "string"
        },
        "trigger_message_id": {
          "type": "string"
        },
        "external_tenant_id": {
          "type": "string"
        },
        "limit": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100
        },
        "strategy": {
          "enum": [
            "since_last_trigger",
            "wecom_recent"
          ]
        },
        "allowed": {
          "type": "boolean"
        },
        "previous_trigger_message_id": {
          "type": "string"
        },
        "previous_trigger_created_at_ms": {
          "type": "integer",
          "minimum": 0
        },
        "trigger_text": {
          "type": "string",
          "description": "Expected body for Feishu notification readback or WeCom same-group full-text anchor matching."
        },
        "trigger_format": {
          "enum": ["text", "markdown"],
          "description": "Stored outbound format for Feishu notification readback. Older notification jobs default to text."
        }
      }
    },
    "HistorySnapshot": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "status",
        "items"
      ],
      "properties": {
        "status": {
          "enum": [
            "complete",
            "partial",
            "unavailable"
          ]
        },
        "items": {
          "type": "array",
          "maxItems": 100,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "message_id",
              "sender_id",
              "text",
              "created_at_ms"
            ],
            "properties": {
              "message_id": {
                "type": "string"
              },
              "sender_id": {
                "type": "string"
              },
              "sender_type": {
                "type": "string"
              },
              "message_type": {
                "type": "string"
              },
              "text": {
                "type": "string",
                "maxLength": 32768
              },
              "created_at_ms": {
                "type": "integer",
                "minimum": 1
              },
              "sender_name": {
                "type": "string",
                "maxLength": 1024
              },
              "sender_id_type": {
                "type": "string",
                "maxLength": 64
              },
              "sender_tenant": {
                "type": "string",
                "maxLength": 256
              },
              "mentions": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [],
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "key": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string",
                      "maxLength": 1024
                    },
                    "id_type": {
                      "type": "string",
                      "maxLength": 64
                    },
                    "tenant_key": {
                      "type": "string",
                      "maxLength": 256
                    }
                  }
                },
                "maxItems": 100
              },
              "record_key": {
                "type": "string",
                "description": "WeCom job-local evidence key only, never a provider message identity."
              }
            },
            "description": "Feishu uses actual message_id. WeCom requires message_id empty, record_key scoped only to this job, sender_type unknown, empty sender_id_type and mentions; historical labels are never authorization identities."
          }
        },
        "error_code": {
          "type": "string"
        },
        "digest": {
          "type": "string"
        },
        "truncated": {
          "type": "boolean"
        }
      }
    },
    "Delivery": {
      "type": "object",
      "additionalProperties": false,
      "required": [],
      "properties": {
        "config_revision": {
          "type": "integer",
          "minimum": 1
        },
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "lease_token": {
          "type": "string",
          "format": "uuid"
        },
        "binding_id": {
          "type": "string",
          "format": "uuid"
        },
        "idempotency_key": {
          "type": "string",
          "format": "uuid"
        },
        "connection_generation": {
          "type": "integer",
          "minimum": 1
        },
        "chat_id": {
          "type": "string"
        },
        "reply_to_message_id": {
          "type": "string",
          "description": "The original inbound provider message ID. This is an anchor, never a session webhook or proof that webhook routing is supported."
        },
        "session_webhook_eligible": {
          "type": "boolean",
          "description": "Present only for an authorized ordinary non-attachment DingTalk text or Markdown reply. Missing means active sending only."
        },
        "thread_id": {
          "type": "string",
          "description": "Verified provider thread ID from the source inbox; empty for the main chat. Topic replies target reply_to_message_id inside this thread."
        },
        "text": {
          "type": "string"
        },
        "format": {
          "type": "string",
          "enum": [
            "text",
            "markdown",
            "image",
            "file"
          ],
          "default": "text",
          "description": "Immutable delivery content format. Missing means the existing provider text format."
        },
        "allowed": {
          "type": "boolean"
        },
        "provider": {
          "type": "string",
          "enum": [
            "feishu",
            "dingtalk",
            "wecom"
          ]
        },
        "external_tenant_id": {
          "type": "string"
        },
        "chat_type": {
          "type": "string"
        },
        "recipient_id": {
          "type": "string",
          "description": "Direct-chat recipient; empty for groups."
        },
        "provider_request_id": {
          "type": "string"
        },
        "target_digest": {
          "type": "string"
        },
        "query_token": {
          "type": "string"
        },
        "artifact_id": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "Artifact": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "artifact_id",
        "version",
        "name",
        "media_type",
        "size_bytes"
      ],
      "properties": {
        "artifact_id": {
          "type": "string",
          "format": "uuid"
        },
        "version": {
          "type": "string",
          "pattern": "^[0-9a-f]{64}$"
        },
        "name": {
          "type": "string"
        },
        "media_type": {
          "type": "string"
        },
        "size_bytes": {
          "type": "integer",
          "minimum": 0,
          "maximum": 33554432
        }
      }
    }
  },
  "inbox": {
    "post": {
      "operationId": "receiveChannelInbox",
      "description": "Dedicated Hub credential only. SDK verified event identity, pinned tenant and structured bot mention. Accepted means durable ordinary Inbox or handled WeCom control event, never model acceptance. WeCom control content never enters Inbox or Input. Duplicate event/message IDs do not recreate Input or issue a new control reply. Disabled employee still enters Manager for fixed response.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "responses": {
        "200": {
          "description": "Durable result, not proof that execution or remote delivery completed.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "id",
                  "status"
                ],
                "properties": {
                  "id": {
                    "type": "string",
                    "format": "uuid",
                    "description": "Inbox ID for ordinary events; a transient receipt ID for handled control events."
                  },
                  "status": {
                    "enum": [
                      "accepted",
                      "duplicate"
                    ]
                  },
                  "control_reply": {
                    "type": "string",
                    "enum": [
                      "verified",
                      "used",
                      "expired",
                      "revoked"
                    ],
                    "description": "Only a committed WeCom control event may request a fixed callback reply; absent for ordinary, suppressed, or duplicate events. This is not a remote delivery receipt."
                  }
                }
              }
            }
          }
        },
        "400": {
          "description": "Invalid strict payload."
        },
        "401": {
          "description": "Hub identity required; cookies and Origin rejected."
        },
        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/schemas/Inbound"
            }
          }
        }
      }
    }
  },
  "deliveryClaim": {
