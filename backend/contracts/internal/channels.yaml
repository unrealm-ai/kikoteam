  "deliveryComplete": {
    "post": {
      "operationId": "completeChannelDelivery",
      "description": "Record same-attempt transport facts, including late proof after authorization revocation. A Feishu sent receipt requires the provider message ID. For topic replies the response chat and thread IDs must also match the original inbox target. Missing or mismatched destination evidence leaves the outcome unknown. WeCom requires a matched business ACK. DingTalk acceptance only permits bounded read-only status queries. Completion never authorizes another send.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "responses": {
        "200": {
          "description": "Durable result, not proof that execution or remote delivery completed."
        },
        "400": {
          "description": "Invalid strict payload."
        },
        "401": {
          "description": "Hub identity required; cookies and Origin rejected."
        },
        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "lease_token",
                "status",
                "target_digest"
              ],
              "properties": {
                "lease_token": {
                  "type": "string",
                  "format": "uuid"
                },
                "status": {
                  "enum": [
                    "sent",
                    "accepted",
                    "failed",
                    "unknown"
                  ]
                },
                "provider_message_id": {
                  "type": "string"
                },
                "provider_chat_id": {
                  "type": "string",
                  "description": "Chat ID observed in the Feishu send response."
                },
                "provider_thread_id": {
                  "type": "string",
                  "description": "Thread ID observed in the Feishu send response."
                },
                "provider_created_at_ms": {
                  "type": "string",
                  "pattern": "^[1-9][0-9]*$",
                  "description": "Provider creation timestamp in milliseconds, when available for the confirmed destination."
                },
                "error_code": {
                  "type": "string"
                },
                "provider_request_id": {
                  "type": "string",
                  "maxLength": 2048
                },
                "target_digest": {
                  "type": "string",
                  "pattern": "^[a-fA-F0-9]{64}$"
                },
                "query_token": {
                  "type": "string"
                },
                "evidence_type": {
                  "type": "string",
                  "description": "session_webhook records a successful ordinary non-attachment DingTalk reply in its current send lease. evidence_id is the original inbound message ID, not an outbound ID; no provider IDs or query token accompany it."
                },
                "evidence_id": {
                  "type": "string",
                  "maxLength": 2048
                },
                "provider_session_id": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "parameters": [
      {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ]
  },
  "historyComplete": {
    "post": {
      "operationId": "completeChannelHistory",
      "description": "Freeze only provider messages strictly after the previous context-committed trigger and before the current trigger; exclude both anchors. First trigger uses recent history, maximum 100. Same source is serialized. Partial/unavailable degrades to current message only. Native context receipt advances the boundary, never queued/started/processed status alone. No continuous body window.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "responses": {
        "200": {
          "description": "Durable result, not proof that execution or remote delivery completed."
        },
        "400": {
          "description": "Invalid strict payload."
        },
        "401": {
          "description": "Hub identity required; cookies and Origin rejected."
        },
        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "lease_token",
                "snapshot"
              ],
              "properties": {
                "lease_token": {
                  "type": "string",
                  "format": "uuid"
                },
                "snapshot": {
                  "$ref": "#/schemas/HistorySnapshot"
                }
              }
            }
          }
        }
