            "type": "string",
            "enum": [
              "1"
            ]
          }
        },
        {
          "name": "X-Kiko-Delivery-Media",
          "in": "header",
          "description": "Opt in to native image and file deliveries.",
          "schema": {
            "enum": [
              "1"
            ]
          }
        }
      ],
      "security": [
        {
          "hubBearer": []
        }
      ],
      "responses": {
        "200": {
          "description": "Durable result, not proof that execution or remote delivery completed.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "items"
                ],
                "properties": {
                  "items": {
                    "type": "array",
                    "items": {
                      "$ref": "#/schemas/Delivery"
                    }
                  }
                }
              }
            }
          }
        },
        "400": {
          "description": "Invalid strict payload."
        },
        "401": {
          "description": "Hub identity required; cookies and Origin rejected."
        },
        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "limit"
              ],
              "properties": {
                "limit": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 50
                }
              }
            }
          }
        }
      }
    }
  },
