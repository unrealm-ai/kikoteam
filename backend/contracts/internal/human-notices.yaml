{
  "claim": {
    "post": {
      "operationId": "humanNoticeClaim",
      "description": "Lease settled pending human confirmation notices. Never creates an Inbox entry or replays uncertain sends.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "responses": {
        "200": {
          "description": "Durable result, not proof that execution or remote delivery completed.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "items"
                ],
                "properties": {
                  "items": {
                    "type": "array",
                    "items": {
                      "$ref": "./channels.yaml#/schemas/Delivery"
                    }
                  }
                }
              }
            }
          }
        },
        "400": {
          "description": "Invalid strict payload."
        },
        "401": {
          "description": "Hub identity required; cookies and Origin rejected."
        },
        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "limit"
              ],
              "properties": {
                "limit": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 50
                }
              }
            }
          }
        }
      }
    }
  },
  "authorize": {
    "post": {
      "operationId": "humanNoticeAuthorize",
      "description": "Recheck current source request, private recipient, binding and lease. Authorize exactly one transport attempt.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "responses": {
        "200": {
          "description": "Durable result, not proof that execution or remote delivery completed.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./channels.yaml#/schemas/Delivery"
              }
            }
          }
        },
        "400": {
          "description": "Invalid strict payload."
        },
        "401": {
          "description": "Hub identity required; cookies and Origin rejected."
        },
        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "lease_token"
              ],
              "properties": {
                "lease_token": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          }
        }
      }
    },
    "parameters": [
      {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ]
  },
  "complete": {
    "post": {
      "operationId": "humanNoticeComplete",
      "description": "Record evidence for the same attempt. A Feishu DM requires provider message and chat IDs; DingTalk and WeCom never assign quote IDs.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "responses": {
        "200": {
          "description": "Durable result, not proof that execution or remote delivery completed."
        },
        "400": {
          "description": "Invalid strict payload."
        },
        "401": {
          "description": "Hub identity required; cookies and Origin rejected."
        },
        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "lease_token",
                "status",
                "target_digest"
              ],
              "properties": {
                "lease_token": {
                  "type": "string",
                  "format": "uuid"
                },
                "status": {
                  "enum": [
                    "sent",
                    "accepted",
                    "failed",
                    "unknown"
                  ]
                },
                "provider_message_id": {
                  "type": "string"
                },
                "error_code": {
                  "type": "string"
                },
                "provider_request_id": {
                  "type": "string",
                  "maxLength": 2048
                },
                "target_digest": {
                  "type": "string",
                  "pattern": "^[a-fA-F0-9]{64}$"
                },
                "query_token": {
                  "type": "string"
                },
                "human_confirmation_card": {
                  "type": "boolean",
                  "description": "True only for a confirmed native confirmation card delivery."
                },
                "evidence_type": {
                  "type": "string"
                },
                "evidence_id": {
                  "type": "string",
                  "maxLength": 2048
                },
                "provider_session_id": {
                  "type": "string"
                },
                "provider_created_at_ms": {
                  "type": "string",
                  "pattern": "^[1-9][0-9]*$",
                  "description": "Trusted Feishu response timestamp, never local send time."
                },
                "provider_chat_id": {
                  "type": "string"
                },
                "provider_thread_id": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "parameters": [
      {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ]
  },
  "queryClaim": {
    "post": {
      "operationId": "humanNoticeQueryClaim",
      "description": "Lease read-only DingTalk status checks on previously accepted send attempts, without sending content.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "responses": {
        "200": {
          "description": "Durable result, not proof that execution or remote delivery completed.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "items"
                ],
                "properties": {
                  "items": {
                    "type": "array",
                    "items": {
                      "$ref": "./channels.yaml#/schemas/Delivery"
                    }
                  }
                }
              }
            }
          }
        },
        "400": {
          "description": "Invalid strict payload."
        },
        "401": {
          "description": "Hub identity required; cookies and Origin rejected."
        },
        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "limit"
              ],
              "properties": {
                "limit": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 50
                }
              }
            }
          }
        }
      }
    }
  },
  "dispatchCheck": {
    "post": {
      "operationId": "humanNoticeDispatchCheck",
      "description": "Repeat authorization at the send boundary. Does not create a new attempt.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "responses": {
        "200": {
          "description": "Durable result, not proof that execution or remote delivery completed.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./channels.yaml#/schemas/Delivery"
              }
            }
          }
        },
        "400": {
          "description": "Invalid strict payload."
        },
        "401": {
          "description": "Hub identity required; cookies and Origin rejected."
        },
        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "lease_token"
              ],
              "properties": {
                "lease_token": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          }
        }
      }
    },
    "parameters": [
      {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ]
  },
  "readCard": {
    "parameters": [
      {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "humanNoticeReadCard",
      "description": "Read the canonical question and state for a verified provider callback.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "binding_id",
                "provider",
                "tenant_id",
                "actor_id",
                "connection_generation",
                "config_revision",
                "provider_card_id"
              ],
              "properties": {
                "binding_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "provider": {
                  "enum": [
                    "feishu",
                    "dingtalk",
                    "wecom"
                  ]
                },
                "tenant_id": {
                  "type": "string"
                },
                "actor_id": {
                  "type": "string"
                },
                "connection_generation": {
                  "type": "integer",
                  "minimum": 1
                },
                "config_revision": {
                  "type": "integer",
                  "minimum": 1
                },
                "provider_card_id": {
                  "type": "string"
                },
                "provider_chat_id": {"type": "string", "description": "Required for Feishu."}
              }
            }
          }
        }
      },
      "responses": {
        "200": {
          "description": "Current state for this specific recipient and card."
        },
        "404": {
          "description": "No verified matching delivery."
        },
        "401": {
          "description": "Hub identity required."
        }
      }
    }
  },
  "answerCard": {
    "parameters": [
      {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "humanNoticeAnswerCard",
      "description": "Record a verified provider action on its exact sent native confirmation card.",
      "security": [
        {
          "hubBearer": []
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "binding_id",
                "provider",
                "tenant_id",
                "actor_id",
                "connection_generation",
                "config_revision",
                "provider_card_id",
                "decision"
              ],
              "properties": {
                "binding_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "provider": {
                  "enum": [
                    "feishu",
                    "dingtalk",
                    "wecom"
                  ]
                },
                "tenant_id": {
                  "type": "string"
                },
                "actor_id": {
                  "type": "string"
                },
                "connection_generation": {
                  "type": "integer",
                  "minimum": 1
                },
                "config_revision": {
                  "type": "integer",
                  "minimum": 1
                },
                "provider_card_id": {
                  "type": "string"
                },
                "provider_chat_id": {"type": "string", "description": "Required for Feishu."},
                "decision": {
                  "enum": [
                    "approve",
                    "reject",
                    "information"
                  ]
                },
                "text": {
                  "type": "string",
                  "maxLength": 4000
                },
                "answers": {
                  "type": "array",
                  "maxItems": 12,
                  "items": {
                    "type": "object"
                  }
                }
              }
            }
          }
        }
      },
      "responses": {
        "200": {
          "description": "Current state for this specific recipient and card."
        },
        "404": {
          "description": "No verified matching delivery."
        },
        "401": {
          "description": "Hub identity required."
        }
      }
    }
  }
}
