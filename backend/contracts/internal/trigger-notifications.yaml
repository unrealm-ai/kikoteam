        "409": {
          "description": "Lease lost, authorization revoked, or conflicting state."
        },
        "503": {
          "description": "Transient dependency failure; never acknowledge as durable."
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "limit"
              ],
              "properties": {
                "limit": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 50
                }
              }
            }
          }
        }
      }
    }
  },
