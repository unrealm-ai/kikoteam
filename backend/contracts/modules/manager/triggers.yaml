                },
                "timezone": {
                  "type": "string",
                  "default": "Asia/Shanghai"
                },
                "description": {
                  "type": "string"
                },
                "businessKey": {
                  "oneOf": [
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "properties": {
                        "mode": {
                          "const": "empty"
                        }
                      },
                      "required": [
                        "mode"
