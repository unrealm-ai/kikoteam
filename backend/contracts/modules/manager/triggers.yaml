          "format": "date-time"
        },
        "next_due": {
          "type": [
            "string",
            "null"
          ],
          "format": "date-time"
        },
        "endpoint": {
          "type": "string",
          "format": "uri"
        },
        "last_verified_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
    "Credential": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "key_id": {
          "type": "string",
          "format": "uuid"
        },
        "status": {
          "enum": [
            "active",
            "revoked"
          ]
        },
        "secret": {
          "type": "string",
          "description": "Returned only once by credential creation; never GET."
        },
        "created_at": {
          "type": "string",
          "format": "date-time"
        }
      },
      "required": [
        "key_id",
        "status",
        "created_at"
      ]
    },
    "Receipt": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "event_id": {
          "type": "string"
        },
        "status": {
          "type": "string"
        },
        "task_id": {
          "type": "string",
          "format": "uuid"
        },
        "session_id": {
          "type": "string",
          "format": "uuid"
        },
        "task_space_id": {
          "type": "string",
          "format": "uuid"
        },
        "input_id": {
          "type": "string",
          "format": "uuid"
        },
        "duplicate": {
          "type": "boolean"
        }
      },
      "required": [
        "event_id",
        "status",
        "duplicate"
      ]
    },
    "Event": {
      "type": "object",
      "description": "Trigger acceptance and the execution status of its input or turn.",
      "additionalProperties": false,
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "event_id": {
          "type": "string"
        },
        "action": {
          "enum": [
            "create_task",
            "supplement_task",
            "cancel_task",
            "send_message"
          ]
        },
        "binding_version": {
          "type": "string",
          "pattern": "^[0-9]+$"
        },
        "event_name": {
          "type": "string"
        },
        "execution_status": {
          "type": "string"
        },
        "status": {
          "enum": [
            "pending",
            "accepted",
            "rejected"
          ]
        },
        "received_at": {
          "type": "string",
          "format": "date-time"
        },
        "receipt": {
          "oneOf": [
            {
              "$ref": "#/schemas/Receipt"
            },
            {
              "type": "null"
            }
          ]
        }
      }
    },
    "EventHookConfig": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "adapter",
        "source",
        "prompt"
      ],
      "properties": {
        "adapter": {
          "const": "event"
        },
        "source": {
          "enum": [
            "github",
            "gitlab",
            "gitlab_token",
            "custom"
          ]
        },
        "prompt": {
          "type": "string",
          "minLength": 1,
          "maxLength": 4000
        },
        "repositoryId": {
          "type": "integer",
          "format": "int64",
          "deprecated": true,
          "description": "Accepted for compatibility with older event configurations and ignored."
        }
      }
    }
  },
  "nativeEvent": {
    "parameters": [
      {
        "name": "trigger_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "receiveNativeTriggerEvent",
      "security": [
        { "githubWebhookSignature": [] },
        { "gitlabWebhookSignature": [] },
        { "gitlabWebhookToken": [] },
        { "customWebhookToken": [] }
      ],
      "description": "Receives the original POST body over HTTP or HTTPS, up to 256 KiB. No cookies, Origin or query. The hook's credentials authenticate each delivery. GitHub signs the original JSON or URL-encoded form. GitLab signing mode covers message ID, timestamp and body with a five-minute window. Legacy token mode is explicit. Custom sources use Bearer authentication and optional Idempotency-Key (absent means a new task each time). Each new business event creates a task with the saved prompt and event data, including any repository or project identity supplied by the sender. Same delivery and body replay the original receipt, conflicting body returns 409. Authenticated webhook rate budget applies.",
      "responses": {
        "200": {
          "description": "Current fact",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/schemas/Receipt"
              }
            }
          }
        },
        "default": {
          "$ref": "./sessions.yaml#/responses/Error"
        },
        "202": {
          "description": "Current fact",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/schemas/Receipt"
              }
            }
          }
        },
        "204": {
          "description": "Verified GitHub connection ping; no task"
        },
        "429": {
          "description": "Authenticated Hook rate limited. No event/dedup slot or task was created. Retry the same event after waiting.",
          "headers": {
            "Retry-After": {
              "required": true,
              "schema": {
                "type": "integer",
                "const": 1
              }
            }
          },
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../../openapi.yaml#/components/schemas/Error"
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "X-Hub-Signature-256",
          "in": "header",
          "required": false,
          "schema": {
            "type": "string"
          },
          "description": "GitHub raw-body signature"
        },
        {
          "name": "X-GitHub-Event",
          "in": "header",
          "required": false,
          "schema": {
            "type": "string"
          },
          "description": "GitHub event type"
        },
        {
          "name": "X-GitHub-Delivery",
          "in": "header",
          "required": false,
          "schema": {
            "type": "string"
          },
          "description": "GitHub delivery UUID"
        },
        {
          "name": "webhook-id",
          "in": "header",
          "required": false,
          "schema": {
            "type": "string"
          },
          "description": "GitLab signed message ID"
        },
        {
          "name": "webhook-timestamp",
          "in": "header",
          "required": false,
          "schema": {
            "type": "string"
          },
          "description": "GitLab signed UNIX seconds"
        },
        {
          "name": "webhook-signature",
          "in": "header",
          "required": false,
          "schema": {
            "type": "string"
          },
          "description": "GitLab v1 signature"
        },
        {
          "name": "X-Gitlab-Token",
          "in": "header",
          "required": false,
          "schema": {
            "type": "string"
          },
          "description": "GitLab legacy credential"
        },
        {
          "name": "X-Gitlab-Event",
          "in": "header",
          "required": false,
          "schema": {
            "type": "string"
          },
          "description": "GitLab event name"
        },
        {
          "name": "Idempotency-Key",
          "in": "header",
          "required": false,
          "schema": {
            "type": "string"
          },
          "description": "Stable request ID for custom sources or legacy GitLab"
        }
      ],
      "requestBody": {
        "required": false,
        "content": {
          "*/*": {
            "schema": {
              "description": "Unmodified business payload including UTF-8 text, multipart and binary."
            }
          }
        }
      }
    }
  }
}
