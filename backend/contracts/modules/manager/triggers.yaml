        },
        "kind": {
          "enum": [
            "schedule",
            "webhook"
          ]
        },
        "enabled": {
          "type": "boolean"
        },
        "config": {
          "oneOf": [
            {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "adapter": {
                  "const": "generic"
                }
              },
              "required": [
                "adapter"
              ]
            },
            {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "adapter": {
                  "const": "github_issue"
                },
                "repositoryId": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 9007199254740991
                },
                "installationId": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 9007199254740991
                }
              },
              "required": [
                "adapter",
