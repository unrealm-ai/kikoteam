  "webhook": {
    "parameters": [
      {
        "name": "trigger_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "receiveTriggerWebhook",
      "security": [],
      "description": "No Cookie/Origin identity. Requires HTTPS directly or https forwarded by a configured trusted proxy. Maximum raw body 256 KiB. Event deduplication is separate from business key; duplicate same body returns original receipt, changed body conflicts. HMAC SHA256 over v1\\nPOST\\n/api/triggers/webhook/{trigger_id}\\n{timestamp}\\n{sha256(raw-body)}. Timestamp is decimal Unix milliseconds within 5 minutes. Signature lowercase hex. Allowed actions and employee binding checked. Supplement/cancel only target this trigger’s own task. A validated callback consumes one credit in the durable per-workspace/trigger budget (120/minute, burst 20). Unauthenticated callbacks are not charged.",
      "responses": {
        "200": {
          "description": "Current fact",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/schemas/Receipt"
              }
            }
          }
        },
        "default": {
          "$ref": "./sessions.yaml#/responses/Error"
        },
        "202": {
          "description": "Current fact",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/schemas/Receipt"
              }
            }
          }
        },
        "429": {
          "description": "Authenticated Hook rate limited. No event/dedup slot or task was created. Retry the same event after waiting.",
          "headers": {
            "Retry-After": {
              "required": true,
              "schema": {
                "type": "integer",
                "const": 1
              }
            }
          },
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../../openapi.yaml#/components/schemas/Error"
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "X-Key-Id",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "X-Timestamp",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[0-9]+$"
          }
        },
        {
          "name": "X-Signature",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "version": {
                  "const": 1
                },
                "eventId": {
                  "type": "string",
                  "maxLength": 160,
                  "minLength": 1
                },
                "action": {
                  "enum": [
                    "create_task",
                    "supplement_task",
                    "cancel_task"
                  ]
                },
                "description": {
                  "type": "string"
                },
                "businessKey": {
                  "type": "string",
                  "maxLength": 200
                },
                "taskId": {
                  "type": "string",
                  "format": "uuid"
                },
                "entityId": {
                  "type": "string",
                  "format": "uuid"
                }
              },
              "required": [
                "version",
                "eventId",
                "action"
              ]
            }
          }
        }
      }
    }
  },
  "github": {
    "parameters": [
      {
        "name": "trigger_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "receiveTriggerGithub",
      "security": [],
      "description": "No Cookie/Origin identity. Requires HTTPS directly or https forwarded by a configured trusted proxy. Maximum raw body 256 KiB. Event deduplication is separate from business key; duplicate same body returns original receipt, changed body conflicts. X-Hub-Signature-256 is sha256=HMAC(raw-body). Only issues opened creates tasks; other valid issue actions return 204. Signed repository/optional installation must match configuration. Event key uses repository ID and issue ID, not unsigned delivery header. No GitHub comment/PR/push integration. A validated callback consumes one credit in the durable per-workspace/trigger budget (120/minute, burst 20). Unauthenticated callbacks are not charged.",
      "responses": {
        "200": {
          "description": "Current fact",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/schemas/Receipt"
              }
            }
          }
        },
        "default": {
          "$ref": "./sessions.yaml#/responses/Error"
        },
        "202": {
          "description": "Current fact",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/schemas/Receipt"
              }
            }
          }
        },
        "204": {
          "description": "Ignored supported non-opened GitHub issue action"
        },
        "429": {
          "description": "Authenticated Hook rate limited. No event/dedup slot or task was created. Retry the same event after waiting.",
          "headers": {
            "Retry-After": {
              "required": true,
              "schema": {
                "type": "integer",
                "const": 1
              }
            }
          },
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../../openapi.yaml#/components/schemas/Error"
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "X-Hub-Signature-256",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^sha256=[a-f0-9]{64}$"
          }
        },
        {
          "name": "X-GitHub-Event",
          "in": "header",
          "required": true,
          "schema": {
            "const": "issues"
          }
        },
        {
          "name": "X-GitHub-Delivery",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "description": "GitHub signed issue event body, validated against configured repository and optional installation."
            }
          }
        }
      }
    }
  },
  "schemas": {
    "Write": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "signing_token": {
          "type": "string",
          "writeOnly": true,
          "description": "PUT only. Import a GitLab signing token and enable the trigger atomically with the specified version."
        },
        "name": {
          "type": "string",
          "maxLength": 100
        },
        "version": {
          "type": "string",
          "pattern": "^[0-9]+$"
        },
        "kind": {
          "enum": [
            "schedule",
            "webhook"
          ]
        },
        "enabled": {
          "type": "boolean"
        },
        "config": {
          "oneOf": [
            {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "adapter": {
                  "const": "generic"
                }
              },
              "required": [
                "adapter"
              ]
            },
            {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "adapter": {
                  "const": "github_issue"
                },
                "repositoryId": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 9007199254740991
                },
                "installationId": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 9007199254740991
                }
              },
              "required": [
                "adapter",
                "repositoryId"
              ]
            },
            {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "action": {
                  "enum": [
                    "create_task",
                    "send_message"
                  ],
                  "default": "create_task"
                },
                "cron": {
                  "type": "string",
                  "description": "Five fields; current parser does not support L or #."
                },
                "timezone": {
                  "type": "string",
                  "default": "Asia/Shanghai"
                },
                "description": {
                  "type": "string"
                },
                "businessKey": {
                  "oneOf": [
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "properties": {
                        "mode": {
                          "const": "empty"
                        }
                      },
                      "required": [
                        "mode"
                      ]
                    },
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "properties": {
                        "mode": {
                          "const": "fixed"
                        },
                        "value": {
                          "type": "string",
                          "maxLength": 200
                        }
                      },
                      "required": [
                        "mode",
                        "value"
                      ]
                    },
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "properties": {
                        "mode": {
                          "const": "period"
                        },
                        "period": {
                          "enum": [
                            "minute",
                            "hour",
                            "day",
                            "week",
                            "month",
                            "year"
                          ]
                        }
                      },
                      "required": [
                        "mode",
                        "period"
                      ]
                    }
                  ]
                }
              },
              "required": [
                "cron",
                "description"
              ]
            },
            {
              "$ref": "#/schemas/EventHookConfig"
            }
          ]
        },
        "allowed_actions": {
          "type": "array",
          "minItems": 1,
          "maxItems": 3,
          "uniqueItems": true,
          "items": {
            "enum": [
              "create_task",
              "supplement_task",
              "cancel_task",
              "send_message"
            ]
          }
        },
        "notification_targets": {
          "type": "array",
          "maxItems": 50,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "conversation_id": {
                "type": "string",
                "format": "uuid"
              }
            },
            "required": [
              "conversation_id"
            ]
          }
        }
      },
      "required": [
        "kind",
        "enabled",
        "config",
        "allowed_actions"
      ]
    },
    "Trigger": {
      "$ref": "#/schemas/TriggerFields",
      "unevaluatedProperties": false
    },
    "CreatedTrigger": {
      "$ref": "#/schemas/TriggerFields",
      "properties": {
        "initial_credential": { "$ref": "#/schemas/Credential", "required": ["secret"] }
      },
      "unevaluatedProperties": false
    },
    "TriggerFields": {
      "type": "object",
