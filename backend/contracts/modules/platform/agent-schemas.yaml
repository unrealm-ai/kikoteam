Agent:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    role:
      type: string
    avatar:
      type: string
    instruction:
      type: string
    model_profile_id:
      type: string
      anyOf: [{format: uuid}, {const: ""}]
    platform_model_id: {type: string, format: uuid}
    card_resources:
      description: Returned for list items to all active workspace members. Counts include disabled configurations. Channels report bindings, irrespective of connection status. An employee with no resources has an empty channels array and zero counts.
      type: object
      required: [channels, package_count, trigger_count]
      properties:
        channels:
          type: array
          items: {type: string, enum: [dingtalk, feishu, wecom]}
        package_count: {type: integer, minimum: 0}
        trigger_count: {type: integer, minimum: 0}
    payer:
      type: object
      description: Employee management only.
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    model_name:
      type: string
    harness:
      type: string
      const: pi
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    enabled:
      type: boolean
    model_available:
      type: boolean
    version:
      type: integer
      minimum: 1
    config_version:
      type: integer
      minimum: 1
    admission_epoch:
      type: integer
      minimum: 1
    web_access:
      $ref: ./agent-market.yaml#/schemas/WebAccess
    template_origin:
      $ref: ./agent-market.yaml#/schemas/TemplateOrigin
  required:
  - id
  - name
  - role
  - avatar
  - instruction
  - model_profile_id
  - model_name
  - harness
  - created_at
  - updated_at
  - enabled
  - model_available
  - version
  - config_version
  - admission_epoch
AgentCreate:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 100
      minLength: 1
    role:
      type: string
      maxLength: 2000
    avatar:
      type: string
      maxLength: 100
    instruction:
      type: string
      maxLength: 8000
    model_profile_id:
      type: string
      format: uuid
    platform_model_id: {type: string, format: uuid}
  oneOf:
  - required: [model_profile_id]
  - required: [platform_model_id]
  required:
  - name
AgentPatch:
  type: object
  not: {required: [model_profile_id, platform_model_id]}
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 100
      minLength: 1
    role:
      type: string
      maxLength: 2000
    avatar:
      type: string
      maxLength: 100
    instruction:
      type: string
      maxLength: 8000
    model_profile_id:
      type: string
      format: uuid
    platform_model_id: {type: string, format: uuid}
    confirm_platform_billing: {type: boolean, description: Explicitly confirm first binding for an existing employee using the official chat default.}
    version:
      type: integer
      minimum: 1
    enabled:
      type: boolean
    web_access:
      $ref: ./agent-market.yaml#/schemas/WebAccess
  required:
  - version
AgentPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: '#/Agent'
        required: [card_resources]
    status_counts:
      description: Counts in this workspace matching q, before applying the enabled filter.
      type: object
      required: [enabled, disabled]
      properties:
        enabled: {type: integer, minimum: 0}
        disabled: {type: integer, minimum: 0}
    total:
      type: integer
      minimum: 0
    page:
      type: integer
      minimum: 1
    page_size:
      type: integer
      minimum: 1
      maximum: 100
  required:
  - items
  - status_counts
  - total
  - page
  - page_size
