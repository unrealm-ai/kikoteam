                              "channel",
                              "kind",
                              "id"
                            ],
                            "properties": {
                              "channel": {
                                "enum": [
                                  "web",
                                  "feishu",
                                  "dingtalk",
                                  "wecom"
                                ]
                              },
                              "kind": {
                                "enum": [
                                  "user",
                                  "department",
                                  "group"
                                ]
                              },
                              "id": {
                                "type": "string",
                                "maxLength": 512
                              },
                              "binding_id": {
                                "type": "string",
                                "format": "uuid"
                              },
                              "identity_epoch": {
                                "type": "integer",
                                "minimum": 1
                              },
                              "include_descendants": {
                                "type": "boolean"
                              }
                            },
                            "description": "Web user/group IDs belong to current workspace. External entries require binding_id plus identity_epoch. WeCom users must be verified callback identities; no WeCom departments. Stale entries remain readable but cannot grant across an epoch change."
