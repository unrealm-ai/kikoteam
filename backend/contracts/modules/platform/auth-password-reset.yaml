post:
  operationId: resetPassword
  summary: resetPassword
  description: Consumes a reset_password challenge, replaces the password, marks the proven
    email verified, and revokes every previous session in one transaction. This is also the
    safe verification path for an unverified password-registered account. Login again with the
    new password.
  security: []
  responses:
    '204':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF/email_code_disabled (email disabled),
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429 rate limit,
        503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: X-CSRF-Protection
    in: header
    required: true
    schema:
      type: string
      const: '1'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            email:
              type: string
              format: email
              maxLength: 254
            code:
              type: string
              pattern: ^[0-9]{6}$
            challenge_id:
              type: string
              format: uuid
            new_password:
              type: string
              minLength: 10
              maxLength: 72
          required:
          - email
          - code
          - challenge_id
          - new_password
