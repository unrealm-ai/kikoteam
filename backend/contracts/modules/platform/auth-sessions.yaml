post:
  operationId: createSession
  summary: createSession
  description: 'Creates an HttpOnly session cookie. Password method requires password; code
    method requires code and challenge_id. No bearer token is returned. Each request can create
    a new session. Unverified password-registered accounts cannot use code login: returns 403
    email_verification_required; use code-based password reset to prove email ownership and
    replace old credentials first.'
  security: []
  responses:
    '200':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
        Set-Cookie:
          schema:
            type: string
          description: HttpOnly SameSite=Strict kiko_session; Secure on HTTPS. Never log.
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/AuthResult
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF/email_code_disabled (email disabled),
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429 rate limit,
        503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: X-CSRF-Protection
    in: header
    required: true
    schema:
      type: string
      const: '1'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            email:
              type: string
              format: email
              maxLength: 254
            method:
              type: string
              enum:
              - password
              - code
            password:
              type: string
              maxLength: 72
            code:
              type: string
              pattern: ^[0-9]{6}$
            challenge_id:
              type: string
              format: uuid
          required:
          - email
          - method
          allOf:
          - if:
              properties:
                method:
                  const: code
            then:
              required:
              - code
              - challenge_id
          - if:
              properties:
                method:
                  const: password
            then:
              required:
              - password
