{
  "feishu": {
    "parameters": [
      {
        "name": "workspace_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      {
        "name": "agent_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "testEmployeeFeishuChannelCredentials",
      "security": [
        {
          "sessionCookie": []
        }
      ],
      "parameters": [
        {
          "name": "X-CSRF-Protection",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "const": "1"
          }
        }
      ],
      "description": "Checks only the submitted application credential by fixed provider HTTP endpoint. No bot socket or messages; token success is not a claim of transport connectivity or complete permissions. WeCom performs format validation only with credential_status=format_only and no receipt. Binding and authorization are checked again after provider response.",
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "required": [
                "version",
                "app_id",
                "app_secret"
              ],
              "additionalProperties": false,
              "properties": {
                "version": {
                  "type": "integer",
                  "minimum": 0
                },
                "app_id": {
                  "type": "string"
                },
                "app_secret": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 4096,
                  "writeOnly": true
                }
              }
            }
          }
        }
      },
      "responses": {
        "200": {
          "description": "No binding written. Verified application credentials return a short-lived receipt; WeCom only format_only.",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "credential_status",
                  "tested_at"
                ],
                "properties": {
                  "credential_status": {
                    "type": "string",
                    "enum": [
                      "verified",
                      "format_only"
                    ]
                  },
                  "receipt": {
                    "type": "string"
                  },
                  "tested_at": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "expires_at": {
                    "type": "string",
                    "format": "date-time"
                  }
                }
              }
            }
          }
        },
        "400": {
          "description": "Invalid request or provider rejected credentials"
        },
        "401": {
          "description": "Unauthenticated"
        },
        "403": {
          "description": "Workspace management denied or CSRF failed"
        },
        "404": {
          "description": "Employee missing"
        },
        "409": {
          "description": "Binding changed"
        },
        "429": {
          "description": "Provider rate limit"
        },
        "503": {
          "description": "Validation temporarily unavailable"
        }
      }
    }
  },
