    ],
    "get": {
      "operationId": "getDingTalkSetup",
      "security": [
        {
          "sessionCookie": []
        }
      ],
      "description": "Workspace owner/admin and operation owner only. No-store. Explicit same-device polling, never repeat init/begin. Confirm saves a new binding with empty allowlist; tenant identity awaits authenticated Stream event. No real application is created by GET.",
      "responses": {
        "200": {
          "description": "Setup state or current saved-binding diagnostics",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "registration"
                ],
                "properties": {
                  "registration": {
                    "type": [
                      "object",
                      "null"
                    ],
                    "properties": {
                      "id": {
                        "type": "string",
                        "format": "uuid"
                      },
                      "state": {
                        "type": "string",
                        "enum": [
                          "starting",
                          "awaiting_confirmation",
                          "polling",
                          "ready",
                          "consumed",
                          "cancelled",
                          "expired",
                          "failed",
                          "interrupted"
                        ]
                      },
                      "app_id": {
                        "type": "string"
                      },
                      "verification_url": {
                        "type": "string",
                        "format": "uri"
                      },
                      "expires_at": {
                        "type": "string",
                        "format": "date-time"
                      },
                      "next_poll_at": {
                        "type": "string",
                        "format": "date-time"
                      },
                      "updated_at": {
                        "type": "string",
                        "format": "date-time"
                      },
                      "credential_saved": {
                        "type": "boolean"
                      },
                      "error_code": {
                        "type": "string"
                      },
                      "poll_interval_seconds": {
                        "type": "integer"
                      }
                    },
                    "description": "Never includes device codes or application secrets. Canceling local setup does not delete an external app. connected means validated configuration persisted; Event Hub connection status remains separate."
                  }
                }
              }
            }
          }
        },
        "400": {
          "description": "Invalid request"
        },
        "401": {
          "description": "Unauthenticated"
        },
        "403": {
          "description": "Workspace management denied"
        },
        "404": {
          "description": "Agent or own registration not found"
        },
        "409": {
          "description": "Concurrent setup or binding changed"
        },
        "429": {
          "description": "Too many registrations"
        },
        "502": {
          "description": "Provider response unavailable"
        },
        "503": {
          "description": "Dependency unavailable"
        }
      }
    },
