            "type": "string",
            "const": "1"
          }
        },
        {
          "name": "Idempotency-Key",
          "in": "header",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,128}$"
          },
          "description": "Same key within workspace+agent returns the same registration and never reissues begin. Different actor cannot replay it."
        }
      ],
