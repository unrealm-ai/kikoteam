    ],
    "get": {
      "operationId": "listGroupSharingPolicies",
      "security": [
        {
          "sessionCookie": []
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "items",
                  "total"
                ],
                "properties": {
                  "items": {
                    "type": "array",
                    "items": {
                      "$ref": "#/schemas/Policy"
                    }
                  },
                  "total": {
                    "type": "integer"
                  }
                }
              }
            }
          }
        },
        "default": {
          "$ref": "../manager/sessions.yaml#/responses/Error"
        }
      },
      "parameters": [
        {
          "name": "q",
          "in": "query",
          "schema": {
            "type": "string",
            "maxLength": 100
          }
        },
        {
          "name": "page",
          "in": "query",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100000,
            "default": 1
          }
        },
        {
          "name": "page_size",
          "in": "query",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 20
          }
        }
      ],
      "description": "Workspace owner/admin only; exact employee scope, literal name substring; stable ID ascending pagination. Groups are employee groups, not operator groups. Returns metadata, no read permission or forwarding."
    },
    "post": {
      "operationId": "createGroupSharingPolicy",
      "security": [
        {
          "sessionCookie": []
        }
      ],
      "responses": {
        "201": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/schemas/Policy"
              }
            }
          }
        },
        "default": {
          "$ref": "../manager/sessions.yaml#/responses/Error"
        }
      },
      "parameters": [
        {
          "$ref": "../manager/conversations.yaml#/parameters/csrf"
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/schemas/Put"
            }
          }
        }
      },
      "description": "Creates one named policy; no idempotency key, never automatically retry an uncertain create. Directed sources are groups, targets groups or verified real users; mutual uses at least two source groups and empty targets. No departments/self edges/duplicate identities. Typed references must be currently valid. Does not read history, create conversations or forward messages. Maximum 100 policies per employee."
    }
  },
  "item": {
    "parameters": [
      {
        "name": "workspace_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      {
        "name": "agent_id",
        "in": "path",
        "required": true,
