post:
  operationId: acceptInvitation
  summary: acceptInvitation
  description: Requires verified matching email and inviter still authorized. Atomically
    activates membership. An existing member is not upgraded. Repeated acceptance
    by that recipient is safe; invalid/expired token returns 410.
  security:
  - sessionCookie: []
  responses:
    '200':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Workspace
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF,
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429
        rate limit, 503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: token
    in: path
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
  - name: X-CSRF-Protection
    in: header
    required: true
    schema:
      type: string
      const: '1'
