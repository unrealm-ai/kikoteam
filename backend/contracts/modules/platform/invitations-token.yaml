get:
  operationId: inspectInvitation
  summary: inspectInvitation
  description: Known expired/revoked link returns a business status with contact_email
    instead of 404. Unknown token returns only unknown. Token is secret and must not
    be logged.
  security: []
  responses:
    '200':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/InvitationInspection
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF,
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429
        rate limit, 503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: token
    in: path
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
