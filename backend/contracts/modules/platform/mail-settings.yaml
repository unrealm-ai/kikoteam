settings:
  get:
    operationId: getPlatformMailSettings
    summary: Read instance mail transport and registration policy as a platform administrator
    security:
    - sessionCookie: []
    responses:
      '200':
        $ref: '#/mailSettingsResponse'
      default:
        $ref: '#/error'
  patch:
    operationId: updatePlatformMailSettings
    summary: Save instance mail transport and registration policy as a platform administrator
    description: >-
      Version zero means no mail settings have been saved; email is disabled.
      Every enabled save requires a current test_receipt for the same SMTP
      profile, credential, administrator and configuration version.
      Disabling retains the existing connection and credentials: repeat the existing
      connection fields or leave them empty, do not send a password or require
      registration verification. Settings are stored only in the database.
    security:
    - sessionCookie: []
    parameters:
    - $ref: '#/csrf'
    requestBody:
      $ref: '#/candidateRequest'
    responses:
      '200':
        $ref: '#/mailSettingsResponse'
      default:
        $ref: '#/error'
test:
  post:
    operationId: testPlatformMailSettings
    summary: Send a test email to the signed-in platform administrator
    description: >-
      Sends the candidate using the same authenticated SMTP restrictions as enabling,
      without saving it. The destination is the administrator's account email,
      not a request parameter. SMTP acceptance returns a receipt valid for
      10 minutes; the registration verification choice is independent.
    security:
    - sessionCookie: []
    parameters:
    - $ref: '#/csrf'
    requestBody:
      $ref: '#/candidateRequest'
    responses:
      '200':
        description: The SMTP server accepted the test email for delivery
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ok, test_receipt]
              properties:
                ok: { type: boolean, const: true }
                test_receipt: { type: string, minLength: 1, description: Short-lived proof for an enabled save. }
      default:
        $ref: '#/error'
candidateRequest:
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        description: >-
          For Test or an enabled save, address must be a DNS hostname with port
          465 (implicit TLS) or 587 (STARTTLS); host must match that hostname;
          username and from must be the same email address. The password cannot
          be empty unless retained from the same saved profile.
        required: [version, enabled, registration_verification_required, address, host, username, from, implicit_tls]
        properties:
          version: { type: integer, minimum: 0 }
          enabled: { type: boolean }
          registration_verification_required: { type: boolean }
          address: { type: string }
          host: { type: string }
          username: { type: string }
          from: { type: string }
          implicit_tls: { type: boolean }
          test_receipt:
            type: string
            writeOnly: true
            description: Required for an enabled save. Run the separate test operation and submit the receipt with the same SMTP profile.
          password:
            type: string
            writeOnly: true
            description: Omit or leave blank to retain the current password only for the same server, TLS mode and identity, username, and sender address.
mailSettingsResponse:
  description: Effective mail settings; the password is not returned
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        required: [version, source, enabled, registration_verification_required, address, host, username, from, implicit_tls, password_configured]
        properties:
          version: { type: integer, minimum: 0 }
          source: { type: string, enum: [unset, database] }
          enabled: { type: boolean }
          registration_verification_required: { type: boolean }
          address: { type: string }
          host: { type: string }
          username: { type: string }
          from: { type: string }
          implicit_tls: { type: boolean }
          password_configured: { type: boolean }
csrf:
  name: X-CSRF-Protection
  in: header
  required: true
  schema: { type: string, const: '1' }
error:
  description: Structured error
  content:
    application/json:
      schema:
        $ref: ../../openapi.yaml#/components/schemas/Error
