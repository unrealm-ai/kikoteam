  "resolve": {
    "post": {
      "operationId": "resolvePeopleSelectors",
      "summary": "resolvePeopleSelectors",
      "description": "Cookie authentication; current workspace owner/admin and employee scope required. Selection is not authorization. Writes require same-origin and X-CSRF-Protection: 1. Sources and saved references are revalidated; no conversation creation or model execution.",
      "parameters": [
        {
          "in": "path",
          "name": "workspace_id",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "in": "path",
          "name": "agent_id",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Selection result",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/schemas/Page"
              }
            }
          }
        },
        "400": {
          "description": "Invalid request or unsupported capability"
        },
        "401": {
          "description": "Authentication required"
        },
        "403": {
          "description": "Configuration permission denied"
        },
        "404": {
          "description": "Resource unavailable"
        },
        "409": {
          "description": "Source changed or directory unavailable"
        },
        "503": {
          "description": "Provider unavailable"
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "purpose"
              ],
              "properties": {
                "purpose": {
                  "type": "string",
                  "enum": [
                    "usage",
                    "capability",
                    "sharing",
                    "confirmation"
                  ]
                },
                "refs": {
                  "type": "array",
                  "maxItems": 200,
                  "items": {
                    "$ref": "#/schemas/SelectionRef"
                  }
                },
                "selectors": {
                  "type": "array",
                  "maxItems": 200,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "channel",
                      "kind",
                      "id"
                    ],
                    "properties": {
                      "channel": {
                        "type": "string",
                        "enum": [
                          "web",
                          "feishu",
                          "dingtalk",
                          "wecom"
                        ]
                      },
                      "kind": {
                        "type": "string",
                        "enum": [
                          "user",
                          "department"
                        ]
                      },
                      "id": {
                        "type": "string"
                      },
                      "binding_id": {
                        "type": "string"
                      },
                      "identity_epoch": {
                        "type": "integer"
                      },
                      "include_descendants": {
                        "type": "boolean"
                      }
                    }
                  }
                }
              },
              "oneOf": [
                {
                  "required": [
                    "refs"
                  ],
                  "not": {
                    "required": [
                      "selectors"
                    ]
                  }
                },
                {
                  "required": [
                    "selectors"
                  ],
                  "not": {
                    "required": [
                      "refs"
                    ]
                  }
                }
              ]
            }
          }
        }
      }
    }
