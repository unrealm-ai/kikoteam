                      "required": [
                        "provider",
                        "available",
                        "supports_search",
                        "supports_browse",
                        "supports_department_tree",
                        "supports_pagination",
                        "requires_identity_mapping"
                      ],
                      "properties": {
                        "provider": {
                          "type": "string"
                        },
                        "unavailable_reason": {
                          "type": "string"
                        },
                        "available": {
                          "type": "boolean"
                        },
                        "supports_search": {
                          "type": "boolean"
                        },
                        "supports_browse": {
                          "type": "boolean"
                        },
                        "supports_department_tree": {
