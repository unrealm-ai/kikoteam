list:
  get:
    operationId: listSharedPluginAccounts
    security: &browser [{sessionCookie: []}]
    parameters:
      - &w {in: path, name: workspace_id, required: true, schema: &uuid {type: string, format: uuid}}
    responses:
      '200':
        description: Workspace shared connections and employee counts
        content:
          application/json:
            schema: {type: object, required: [items], properties: {items: {type: array, items: &account {$ref: './plugin-schemas.yaml#/PluginAccount'}}}}
shared:
  parameters:
    - *w
    - &p {in: path, name: plugin_id, required: true, schema: *uuid}
  get:
    operationId: getSharedPluginAccount
    security: *browser
    parameters:
      - &version {in: query, name: plugin_version_id, required: true, schema: *uuid}
    responses:
      '200': &found {description: Fixed-version connection, content: {application/json: {schema: *account}}}
  put:
    operationId: putSharedPluginAccount
    security: *browser
    parameters:
      - &csrf {in: header, name: X-CSRF-Protection, required: true, schema: {type: string, const: '1'}}
    requestBody: {required: true, content: {application/json: {schema: {$ref: './plugin-schemas.yaml#/PluginAccountPut'}}}}
    responses: {'200': *found}
  delete:
    operationId: revokeSharedPluginAccount
    security: *browser
    parameters: [*csrf,*version]
    requestBody: {required: true, content: {application/json: {schema: {$ref: './plugin-schemas.yaml#/PluginAccountRevoke'}}}}
    responses: {'204': {description: Connection revoked}}
source:
  parameters:
    - *w
    - &agent {in: path, name: agent_id, required: true, schema: *uuid}
    - *p
    - {in: query, name: plugin_version_id, schema: *uuid}
  get:
    operationId: getPluginConnectionSource
    security: *browser
    responses:
      '200': &selected {description: Effective connection for the employee, content: {application/json: {schema: {$ref: './plugin-schemas.yaml#/ConnectionSource'}}}}
  put:
    operationId: selectPluginConnectionSource
    security: *browser
    parameters: [*csrf]
    requestBody:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: false, required: [source, revision], properties: {source: {enum: [workspace, agent]}, revision: {type: integer, minimum: 0}}}
    responses: {'200': *selected}
sharedOAuth:
  parameters: [*w,*p]
  post:
    operationId: startSharedPluginOAuth
    security: *browser
    parameters: [*csrf]
    requestBody: &start
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name, version, plugin_version_id]
            properties:
              name: {type: string}
              version: {type: integer, minimum: 0}
              plugin_version_id: *uuid
              auth_method: {const: oauth}
              tenant_oauth:
                type: object
                additionalProperties: false
                description: Workspace OAuth application for the official FXiaoke tenant.
                required: [resource, issuer, client_id, read_tools]
                properties:
                  resource: {type: string, format: uri}
                  issuer: {type: string, format: uri}
                  client_id: {type: string}
                  client_secret: {type: string, writeOnly: true}
                  scopes: {type: string}
                  read_tools: {type: array, minItems: 1, maxItems: 32, items: {type: string}}
    responses: &redirect
      '200': {description: One-time consent URL, content: {application/json: {schema: {type: object, required: [authorization_url], properties: {authorization_url: {type: string, format: uri}}}}}}
agentOAuth:
  parameters: [*w,*agent,*p]
  post:
    operationId: startEmployeePluginOAuth
    security: *browser
    parameters: [*csrf]
    requestBody: *start
    responses: *redirect
callback:
  get:
    operationId: completePluginOAuth
    security: *browser
    parameters:
      - {in: query, name: state, required: true, schema: {type: string}}
      - {in: query, name: code, schema: {type: string}}
      - {in: query, name: iss, schema: {type: string}}
      - {in: query, name: error, schema: {type: string}}
    responses:
      '303': {description: Account verified and browser redirected}
      '200': {description: Same-site continuation for a Strict session cookie, content: {text/html: {schema: {type: string}}}}
      '400': {description: Invalid authorization response}
