ResourceCard:
  type: object
  additionalProperties: false
  description: Repository-maintained display copy, separate from versioned instructions and grants.
  required: [category, summary_zh, summary_en, highlights]
  properties:
    category: {type: string}
    summary_zh: {type: string}
    summary_en: {type: string}
    highlights: {type: string}
Publish:
  type: object
  additionalProperties: false
  required: [source_workspace_id, resource_id, version_id]
  properties:
    oauth: {$ref: ./plugin-schemas.yaml#/OAuthClientInput}
    source_workspace_id: &uuid {type: string, format: uuid}
    resource_id: *uuid
    version_id: *uuid
    version: {type: integer, minimum: 1, description: Required for a new version of an existing official resource.}
Copy:
  type: object
  additionalProperties: false
  required: [version_id]
  properties:
    version_id: *uuid
State:
  type: object
  additionalProperties: false
  required: [version]
  properties:
    version: {type: integer, minimum: 1}
    enabled: {type: boolean}
    listed: {type: boolean}
Revision:
  type: object
  required: [version]
  additionalProperties: false
  properties:
    version: {type: integer, minimum: 1}
Assignment:
  type: object
  required: [version_id, targets]
  additionalProperties: false
  properties:
    version_id: *uuid
    targets:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required: [agent_id, package_id, package_version]
        properties:
          agent_id: *uuid
          package_id: *uuid
          package_version: {type: integer, minimum: 1}
Results:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        type: object
        required: [agent_id, package_id, status]
        properties:
          agent_id: *uuid
          package_id: *uuid
          status: {type: string, description: Assigned, already assigned or a per-target stable error code.}
Uses:
  type: object
  required: [items, total, page, page_size]
  properties:
    total: {type: integer}
    page: {type: integer}
    page_size: {type: integer}
    items:
      type: array
      items:
        type: object
        required: [agent_id, agent_name, package_id, package_name, version_id, enabled, account_ready]
        properties:
          agent_id: *uuid
          agent_name: {type: string}
          package_id: *uuid
          package_name: {type: string}
          version_id: *uuid
          enabled: {type: boolean}
          connection_source: {type: string, enum: [workspace, agent]}
          account_ready: {type: boolean}
