collection:
  get:
    operationId: listOfficialSkills
    description: Authenticated catalog read. Platform administrators also see unlisted definitions.
    security: [{sessionCookie: []}]
    parameters:
      - {name: q, in: query, schema: {type: string, maxLength: 200}}
      - {name: page, in: query, schema: {type: integer, minimum: 1}}
      - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema: {$ref: './skill-schemas.yaml#/SkillPage'}
      default:
        description: Invalid input, insufficient authorization, conflict or service unavailable.
        content:
          application/json:
            schema: {$ref: '../../openapi.yaml#/components/schemas/Error'}
  post:
    operationId: publishOfficialSkill
    description: Platform administrators publish a fixed version or change catalog state. Publishing requires management access to the source workspace.
    security: [{sessionCookie: []}]
    parameters:
      - {name: X-CSRF-Protection, in: header, required: true, schema: {type: string, const: '1'}}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: './resource-catalog-schemas.yaml#/Publish'}
    responses:
      '201':
        description: Success
        content:
          application/json:
            schema: {$ref: './skill-schemas.yaml#/Skill'}
      default:
        description: Invalid input, insufficient authorization, conflict or service unavailable.
        content:
          application/json:
            schema: {$ref: '../../openapi.yaml#/components/schemas/Error'}
