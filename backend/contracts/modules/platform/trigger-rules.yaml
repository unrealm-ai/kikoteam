                        "maxLength": 1000
                      },
                      "channels": {
                        "type": "array",
                        "minItems": 1,
                        "maxItems": 2,
                        "uniqueItems": true,
                        "items": {
                          "enum": [
                            "web",
                            "feishu"
                          ]
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "responses": {
        "200": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "matched_count",
                  "matched"
                ],
                "properties": {
                  "matched_count": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "matched": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "rule_id",
                        "rule_name",
                        "type",
                        "matched_text"
                      ],
                      "properties": {
                        "rule_id": {
                          "type": "string"
                        },
                        "rule_name": {
                          "type": "string"
                        },
                        "type": {
