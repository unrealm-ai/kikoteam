    "post": {
      "operationId": "testAgentTriggerRules",
      "security": [
        {
          "sessionCookie": []
        }
      ],
      "description": "Tests supplied unsaved rules using the same matcher as EventHub/Manager. Does not save configuration, create messages or trigger employees. Requires workspace owner/admin; POST CSRF protection.",
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "channel",
                "text",
                "rules"
              ],
              "properties": {
                "channel": {
                  "enum": [
                    "web",
                    "feishu"
                  ]
                },
                "text": {
                  "type": "string",
                  "maxLength": 65536
                },
                "rules": {
                  "type": "array",
                  "maxItems": 48,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "id",
                      "type",
                      "name",
                      "pattern",
                      "enabled",
                      "description",
                      "channels"
                    ],
                    "properties": {
