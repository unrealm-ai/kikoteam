    "get": {
      "operationId": "getAgentTriggerRules",
      "security": [
        {
          "sessionCookie": []
        }
      ],
      "responses": {
        "200": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "version",
                  "rules"
                ],
                "properties": {
                  "version": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "rules": {
                    "type": "array",
                    "maxItems": 48,
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "id",
                        "type",
                        "name",
                        "pattern",
                        "enabled",
                        "description",
                        "channels"
                      ],
                      "properties": {
                        "id": {
                          "type": "string",
                          "maxLength": 128,
                          "description": "Blank for a new rule; existing stable ID otherwise."
                        },
                        "type": {
                          "enum": [
                            "keyword",
                            "regex"
                          ]
                        },
                        "name": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 100
                        },
                        "pattern": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 256
                        },
                        "enabled": {
                          "type": "boolean"
                        },
                        "description": {
                          "type": "string",
                          "maxLength": 1000
                        },
                        "channels": {
                          "type": "array",
                          "minItems": 1,
                          "maxItems": 2,
                          "uniqueItems": true,
                          "items": {
                            "enum": [
                              "web",
                              "feishu"
                            ]
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "400": {
          "description": "Invalid rule or unsupported Go RE2 expression"
        },
        "401": {
          "description": "Unauthenticated"
        },
        "403": {
          "description": "Workspace owner/admin required"
        },
        "404": {
          "description": "Employee not found"
        },
        "409": {
          "description": "Version conflict"
        }
      }
    },
