        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "search_user_id",
                "request_id"
              ],
              "properties": {
                "search_user_id": {
                  "type": "string",
                  "maxLength": 256
                },
                "request_id": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          }
        }
      }
    }
  },
