post:
  operationId: revokeInvitation
  summary: revokeInvitation
  description: Revokes remaining pending recipients of a shared link. Previously accepted memberships are preserved. Repeating revoke is safe. Only owners may revoke admin invitations.
  security:
  - sessionCookie: []
  responses:
    '204':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF,
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429
        rate limit, 503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: invitation_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: X-CSRF-Protection
    in: header
    required: true
    schema:
      type: string
      const: '1'
