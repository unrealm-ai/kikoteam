get:
  operationId: listInvitations
  summary: listInvitations
  description: Owner/admin only. Link is returned only upon creation; pending invitation
    does not activate membership. Each email recipient has a separate acceptance and delivery record.
  security:
  - sessionCookie: []
  responses:
    '200':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/InvitationPage
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF/email_code_disabled (new email invitations disabled),
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429
        rate limit, 503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 1000000
      default: 1
  - name: page_size
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
post:
  operationId: createInvitation
  summary: createInvitation
  description: Owner/admin only. Link is returned only upon creation; pending invitation
    does not activate membership. Each email recipient has a separate acceptance and delivery record. Admin may
    invite only member. Creating again creates a new link.
  security:
  - sessionCookie: []
  responses:
    '201':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Invitation
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF/email_code_disabled (new email invitations disabled),
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429
        rate limit, 503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: X-CSRF-Protection
    in: header
    required: true
    schema:
      type: string
      const: '1'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [email, link]
              default: email
            email:
              type: string
              format: email
              maxLength: 254
            emails:
              type: array
              minItems: 1
              items: {type: string, format: email, maxLength: 254}
              description: One shared link restricted to the normalized, distinct addresses.
            role:
              type: string
              enum: [admin, member]
              default: member
            expires_in_days:
              type: integer
              minimum: 1
              maximum: 180
              description: Defaults to 7 for link and 1 for email.
          oneOf:
          - required: [kind]
            properties:
              kind:
                const: link
              role:
                const: member
            not:
              anyOf:
              - required: [email]
              - required: [emails]
          - required: [email]
            properties:
              kind:
                const: email
          - required: [emails]
            properties:
              kind:
                const: email
