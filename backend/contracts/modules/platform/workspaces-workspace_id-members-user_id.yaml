patch:
  operationId: updateMember
  summary: updateMember
  description: Requires owner/admin and current version. Cannot modify owner or self;
    an admin cannot modify/grant admin. Removing or disabling an unrelated pending
    invite does not grant membership.
  security:
  - sessionCookie: []
  responses:
    '200':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Member
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF,
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429
        rate limit, 503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: user_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: X-CSRF-Protection
    in: header
    required: true
    schema:
      type: string
      const: '1'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            role:
              type: string
              enum:
              - admin
              - member
            status:
              type: string
              enum:
              - active
              - disabled
            version:
              type: integer
              minimum: 1
          required:
          - version
delete:
  operationId: removeMember
  summary: removeMember
  description: Requires owner/admin and current version. Cannot modify owner or self;
    an admin cannot modify/grant admin. Removing or disabling an unrelated pending
    invite does not grant membership.
  security:
  - sessionCookie: []
  responses:
    '204':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF,
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429
        rate limit, 503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: user_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: X-CSRF-Protection
    in: header
    required: true
    schema:
      type: string
      const: '1'
  - name: version
    in: query
    required: true
    schema:
      type: integer
      minimum: 1
