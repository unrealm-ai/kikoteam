get:
  operationId: listMembers
  summary: listMembers
  description: Active members may list the workspace membership; results are ordered
    and paginated.
  security:
  - sessionCookie: []
  responses:
    '200':
      description: Success
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Request trace identifier
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/MemberPage
    default:
      description: Structured error (400 invalid input, 401 no session, 403 forbidden/CSRF,
        404 missing resource, 409 stale version/conflict, 410 invalid invite, 429
        rate limit, 503 dependency unavailable).
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Error
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 1000000
      default: 1
  - name: page_size
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
