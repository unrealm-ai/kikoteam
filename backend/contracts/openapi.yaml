openapi: 3.1.0
info:
  title: Kiko Platform API
  version: 1.0.0
  description: 'Platform identity and workspace API. Platform session writes require cookie credentials,
    X-CSRF-Protection: 1 and same-origin requests. Public task detail routes use a separate scoped bearer grant. Google OAuth is not implemented. Registration
    atomically creates an account, a personal workspace and a session; invitation acceptance is a separate authenticated step.
    Unexpected database errors fail only the current request.'
