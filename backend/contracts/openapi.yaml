components:
  securitySchemes:
    taskDetailBearer:
      type: http
      scheme: bearer
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
    gitlabWebhookSignature:
      type: apiKey
      in: header
      name: webhook-signature
    gitlabWebhookToken:
      type: apiKey
      in: header
      name: X-Gitlab-Token
    customWebhookToken:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: kiko_session
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
          required:
          - code
          - message
          - request_id
      required:
      - error
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_platform_admin:
          type: boolean
        platform_admin_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        email_verified:
          type: boolean
      required:
      - id
      - email
      - name
      - email_verified
    Workspace:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        role:
          type: string
          enum:
          - owner
          - admin
          - member
        version:
          type: integer
          minimum: 1
      required:
      - id
      - name
      - description
      - role
      - version
    Member:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum:
          - owner
          - admin
          - member
        status:
          type: string
          enum:
          - active
          - disabled
        joined_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      required:
      - id
      - name
      - email
      - role
      - status
      - version
      - joined_at
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [email, link]
        email:
          description: Present only for email-targeted invitations.
          type: string
          maxLength: 254
        role:
          type: string
          enum:
          - admin
          - member
        status:
          type: string
          enum:
          - pending
          - expired
          - revoked
          - accepted
        shared:
          type: boolean
          description: Recipients share one verified-email link. Retry targets this row, and revocation closes all pending rows for the link.
        delivery_status:
          type: string
          enum: [not_applicable, pending, sending, sent, failed, unknown, cancelled]
          description: Sent means accepted by SMTP, not delivery to inbox.
        expires_at:
          type: string
          format: date-time
        contact_email:
          type: string
          format: email
          maxLength: 254
        link:
          type: string
          format: uri
      required:
      - id
      - kind
      - role
      - status
      - delivery_status
      - expires_at
      - contact_email
    InvitationInspection:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - valid
          - expired
          - revoked
          - accepted
          - unknown
        kind:
          type: string
          enum: [email, link]
        workspace_name:
          type: string
        contact_email:
          type: string
          format: email
          maxLength: 254
        email_masked:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - member
      required:
      - status
    CodeReceipt:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        resend_after:
          type: integer
          minimum: 0
      required:
      - challenge_id
      - expires_at
      - resend_after
    AuthResult:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
    Me:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
      required:
      - user
      - workspaces
    WorkspacePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
          maximum: 1000000
        page_size:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - items
      - total
      - page
      - page_size
    MemberPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
          maximum: 1000000
        page_size:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - items
      - total
      - page
      - page_size
    InvitationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
          maximum: 1000000
        page_size:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - items
      - total
      - page
      - page_size
security:
- sessionCookie: []
